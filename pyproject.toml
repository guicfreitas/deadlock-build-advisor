[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadlock-build-advisor"
version = "0.1.0"
description = "Counter builds for Deadlock: lane build vs your lane opponents + full build vs the enemy team."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # stdlib only

[project.scripts]
deadlock-advisor = "deadlock_advisor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deadlock_advisor = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
